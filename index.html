<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trivia de Fútbol</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="contenedor">

    <!-- PANTALLA DE INICIO -->
    <section id="pantalla-inicio" class="pantalla activa">

      <div class="icono">⚽</div>

      <h1>TRIVIA DE FÚTBOL</h1>

      <p>
        Pon a prueba tus conocimientos sobre el deporte rey
      </p>

      <button id="boton-iniciar">
        COMENZAR A JUGAR
      </button>

    </section>


    <!-- PANTALLA DE PREGUNTAS -->
    <section id="pantalla-juego" class="pantalla">

      <div class="encabezado">

        <span id="contador">
          Pregunta 1 de 10
        </span>

        <span id="puntos">
          Puntos: 0
        </span>

      </div>


      <!-- Barra de progreso -->
      <div class="contenedor-progreso">

        <div id="barra-progreso"></div>

      </div>


      <!-- Pregunta -->
      <h2 id="pregunta">
        Aquí aparecerá la pregunta
      </h2>


      <!-- Respuestas -->
      <div id="opciones">

        <!-- JavaScript pondrá las opciones aquí -->

      </div>


      <!-- Mensaje -->
      <p id="mensaje"></p>


      <!-- Botón siguiente -->
      <button id="boton-siguiente" disabled>

        SIGUIENTE →

      </button>

    </section>


    <!-- PANTALLA FINAL -->
    <section id="pantalla-final" class="pantalla">

      <div class="icono">
        🏆
      </div>

      <h1>¡JUEGO TERMINADO!</h1>

      <h2 id="resultado"></h2>

      <p id="mensaje-final"></p>

      <button id="boton-reiniciar">

        JUGAR OTRA VEZ

      </button>

    </section>

  </main>


  <footer>

    Diseñado por Alejandro Romero

  </footer>


  <script src="script.js"></script>

</body>
</html>
<script src="game.js"></script>
